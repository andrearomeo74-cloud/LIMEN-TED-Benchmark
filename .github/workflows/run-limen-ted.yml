name: LIMEN TED full-stack execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deterministic runner
        run: docker build -t limen-ted-runner:v0.1 .

      - name: Execute six predeclared pairs
        run: |
          docker run --name limen-ted limen-ted-runner:v0.1
          docker cp limen-ted:/work/LIMEN_TED_EXECUTION_RECEIPT.zip ./LIMEN_TED_EXECUTION_RECEIPT.zip

      - name: Expose receipt checksum
        run: sha256sum LIMEN_TED_EXECUTION_RECEIPT.zip

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: LIMEN_TED_EXECUTION_RECEIPT
          path: LIMEN_TED_EXECUTION_RECEIPT.zip
          if-no-files-found: error
