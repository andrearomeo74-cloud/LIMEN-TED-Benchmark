name: LIMEN TED v0.2 Wave 2 execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deterministic runner
        run: docker build -t limen-ted-v02-wave2 .

      - name: Execute nine preregistered oracle pairs
        run: |
          docker run --name limen-ted-v02-wave2 limen-ted-v02-wave2
          docker cp limen-ted-v02-wave2:/work/LIMEN_TED_v0.2_WAVE2_EXECUTION_RECEIPT.zip ./LIMEN_TED_v0.2_WAVE2_EXECUTION_RECEIPT.zip

      - name: Expose receipt checksum
        run: sha256sum LIMEN_TED_v0.2_WAVE2_EXECUTION_RECEIPT.zip

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: LIMEN_TED_v0.2_WAVE2_EXECUTION_RECEIPT
          path: LIMEN_TED_v0.2_WAVE2_EXECUTION_RECEIPT.zip
          if-no-files-found: error
